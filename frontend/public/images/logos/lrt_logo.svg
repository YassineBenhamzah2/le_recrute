<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <defs>
    <linearGradient id="lrtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Hexagonal / Shield Base -->
    <rect x="0" y="0" width="58" height="58" rx="14" fill="url(#lrtGrad)" />
    <!-- Inner Accent Border -->
    <rect x="2" y="2" width="54" height="54" rx="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Stylized "1" + Human/Talent Figure -->
    <!-- Head / Star -->
    <circle cx="29" cy="18" r="5" fill="#FFFFFF" />
    <!-- Body / Laurel / Arrow -->
    <path d="M29 26 C22 26 18 31 18 38 L40 38 C40 31 36 26 29 26 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M25 41 L33 41 L33 48 L25 48 Z" fill="url(#goldGrad)" />
    <polygon points="29,10 31,14 35,15 32,18 33,22 29,20 25,22 26,18 23,15 27,14" fill="#FDE047" opacity="0.9" />
  </g>

  <!-- Typography: Name & Subtitle -->
  <g transform="translate(74, 16)">
    <!-- Main Institution Name -->
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="900" fill="#0F172A" letter-spacing="0.5">
      1ER RECRUTEUR
    </text>
    
    <!-- Sub-heading / Department -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8" letter-spacing="1.8">
      GESTION DES TALENTS &amp; RH
    </text>

    <!-- Tagline -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#64748B" letter-spacing="1">
      PORTAIL OFFICIEL DE RECRUTEMENT
    </text>
  </g>
</svg>
